<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipFlow — TikTok Auth Callback</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 40px;
      max-width: 520px;
      width: 90%;
      border: 1px solid #2a2a2a;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #fff;
    }
    p { color: #999; margin-bottom: 24px; line-height: 1.5; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #2a2a2a;
      border-top-color: #4ecdc4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success { color: #4ecdc4; font-weight: 600; }
    .error { color: #ff6b6b; }
    .hidden { display: none; }
    .footer { margin-top: 24px; font-size: 0.8rem; color: #555; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔐 TikTok Auth — ClipFlow</h1>

    <div id="loading">
      <div class="spinner"></div>
      <p>⏳ Redirecionando para o ClipFlow...</p>
    </div>

    <div id="error" class="hidden">
      <p class="error">❌ Erro na autorização</p>
      <p id="errorMsg"></p>
      <div style="margin-top:16px;">
        <p style="color:#999;font-size:0.85rem;">Detalhes técnicos:</p>
        <pre id="errorDetails" style="background:#0d0d0d;padding:12px;border-radius:8px;margin-top:8px;font-size:0.75rem;color:#ff6b6b;word-break:break-all;overflow-x:auto;"></pre>
      </div>
    </div>

    <div class="footer">
      ClipFlow — Renda Extra &copy; 2026
    </div>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const error = params.get('error');
      const errorDesc = params.get('error_description');

      // ClipFlow backend
      const CLIPFLOW_API = 'http://10.3.60.52:3005';
      const CALLBACK_URL = CLIPFLOW_API + '/api/tiktok/callback' + window.location.search;

      if (error) {
        // Mostra erro e link manual
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
        document.getElementById('errorMsg').innerHTML = errorDesc
          ? `❌ ${error}: ${errorDesc}`
          : '❌ ' + error;

        const detailsEl = document.getElementById('errorDetails');
        detailsEl.textContent = [
          `error: ${error}`,
          `description: ${errorDesc || '(none)'}`,
          `full_url: ${window.location.href}`,
        ].join('\n');
        return;
      }

      if (!code) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
        document.getElementById('errorMsg').textContent = 'Nenhum código de autorização recebido. Acesse via "Conectar TikTok" no ClipFlow.';
        document.getElementById('errorDetails').textContent =
          'URL sem code:\n' + window.location.href;
        return;
      }

      // Redirect para o ClipFlow backend com todos os params
      // Usar window.location.replace para não poluir o histórico
      console.log('[ClipFlow Callback] Redirecting to:', CALLBACK_URL);
      window.location.replace(CALLBACK_URL);
    })();
  </script>
</body>
</html>
